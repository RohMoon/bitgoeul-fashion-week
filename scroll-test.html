<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Snap Test</title>
    <style>
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        .section {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }
        
        .section1 { background: #ff6b6b; }
        .section2 { background: #4ecdc4; }
        .section3 { background: #45b7d1; }
    </style>
</head>
<body>
    <div class="section section1">섹션 1</div>
    <div class="section section2">섹션 2</div>
    <div class="section section3">섹션 3</div>
</body>
</html>
